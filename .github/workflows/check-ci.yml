name: Code Checks

on:
  workflow_call:

env:
  CI_NAME: Code Checks

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check simplified stroke data
        run: python3 tools/test_generate_stroke_orders.py

      # Install Lua from lua.org instead of the Ubuntu mirrors, which can be
      # unreachable from runners. Fall back to apt (with retries) if needed.
      - name: Setup Lua
        id: setup-lua
        continue-on-error: true
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Setup Lua (apt fallback)
        if: steps.setup-lua.outcome != 'success'
        run: |
          for i in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 \
              && sudo apt-get install -y -o Acquire::Retries=3 lua5.4 \
              && sudo ln -sf "$(command -v lua5.4)" /usr/local/bin/lua \
              && break
            echo "apt attempt $i failed, retrying in 20s"
            sleep 20
          done
          command -v lua

      - name: Check Lua candidate filters
        run: |
          lua -v
          for test in app/src/test/lua/*_test.lua; do lua "$test"; done

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Check code style
        run: make style-lint

      - name: Run unit tests and lint
        run: make check
