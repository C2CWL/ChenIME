name: Code Checks

on:
  workflow_call:

env:
  CI_NAME: Code Checks

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Check simplified stroke data
        run: python3 tools/test_generate_stroke_orders.py

      - name: Check Lua candidate filters
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          for test in app/src/test/lua/*_test.lua; do lua5.4 "$test"; done

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          # will restore cache of dependencies and wrappers
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Check code style
        run: make style-lint

      - name: Run unit tests and lint
        run: make check
