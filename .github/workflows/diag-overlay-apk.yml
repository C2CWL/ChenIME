# Signed release-variant APK for diagnosing the compact candidate stall.
# Official package name so it overlays the installed app; no GitHub Release.
name: Diagnostic overlay APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_NAME: Diagnostic overlay APK
  BUILD_ABI: arm64-v8a

jobs:
  build-arm64:
    if: github.repository == 'C2CWL/ChenIME'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 25
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools cmake;3.31.6"

      - name: Calculate JNI cache hash
        id: cache-hash
        run: ./gradlew :app:calculateNativeCacheHash

      - name: Fetch JNI cache
        uses: actions/cache@v6
        id: jni-cache
        with:
          path: "app/prebuilt"
          key: ${{ runner.os }}-trime-jni-release-${{ steps.cache-hash.outputs.native-cache-hash }}

      - name: Setup Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf 'keyBase64=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$SIGNING_KEY" "$KEY_STORE_PASSWORD" "$ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Bump versionCode for overlay install
        run: |
          set -euo pipefail
          f=app/build.gradle.kts
          cur=$(sed -n "s/.*versionCode = \([0-9][0-9]*\).*/\1/p" "$f" | head -n 1)
          next=$((cur + 1))
          sed -i "s/versionCode = $cur/versionCode = $next/" "$f"
          grep -n "versionCode = $next" "$f"

      - name: Build arm64 release
        run: make release

      - name: Add JNI cache
        if: ${{ !steps.jni-cache.outputs.cache-hit }}
        run: cp -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib app/prebuilt

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v7
        with:
          name: chenime-diag-arm64
          path: app/build/outputs/apk/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
