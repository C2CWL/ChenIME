# Dedicated English completion; never reuse the Chinese prism or user database.
schema:
  schema_id: chen_eng
  name: 英文
  version: "1.0"

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]

# Keep physical Shift/Caps as letter modifiers, and ignore global inline-ASCII rules.
ascii_composer:
  good_old_caps_lock: false
  inline_uppercase: false
  inline_keypad: false
  switch_key: {}
  bindings: {}

menu:
  page_size: 5 # same as default.yaml (inherited by rime_frost)

engine:
  processors:
    - ascii_composer
    - lua_processor@*chen_eng_processor
    - recognizer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - lua_translator@*chen_eng_translator
  filters:
    - lua_filter@*chen_eng_case
    - uniquifier

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ'"
  delimiter: " "
  algebra:
    - derive/^.+$/\L$0/
    - derive/^.+$/\U$0/
    - derive/^./\U$0/

translator:
  dictionary: melt_eng
  prism: chen_eng
  user_dict: chen_eng
  enable_completion: true
  enable_sentence: false
  enable_user_dict: true

# Recognize partial addresses too: typing punctuation must not accept a completion.
recognizer:
  patterns:
    email: "^[A-Za-z][-_.0-9A-Za-z]*@.*$"
    url: "^(www[.]|https?:|ftp[.:]|mailto:|file:).*$|^[A-Za-z][-0-9A-Za-z]*[./:].*$"
    alphanumeric: "^[A-Za-z'][A-Za-z'0-9]*[0-9][A-Za-z'0-9]*$"
