# Visual references: user attachments (讯飞), Images #1 and #2.
# Keep Settings > Keyboard > Hide key symbols disabled.
# Inherits standard fonts, actions and preview settings from tongwenfeng.
config_version: '1.0'
name: New布局
author: Trime community; based on tongwenfeng
style:
  __include: tongwenfeng.trime:/style
  horizontal_gap: 4
  vertical_gap: 4
  keyboard_padding_bottom: 0
  keyboard_padding_land_bottom: 0
  round_corner: 8
  keyboard_height: 280
  key_height: 56
  key_text_size: 25
  key_long_text_size: 18
  symbol_text_size: 11
  key_text_offset_y: 5
  enter_labels:
    go: 前往
    done: 完成
    next: 下个
    pre: 上个
    search: 搜索
    send: 发送
    default: 完成
fallback_colors:
  __include: tongwenfeng.trime:/fallback_colors
preset_color_schemes:
  default:
    name: New布局深色
    dark_scheme: default
    light_scheme: light
    back_color: '0xff1b1b1b'
    keyboard_back_color: '0xff1b1b1b'
    root_background: '0xff1b1b1b'
    candidate_background: '0xff1b1b1b'
    text_back_color: '0xff1b1b1b'
    liquid_keyboard_background: '0xff1b1b1b'
    key_back_color: '0xff444444'
    preview_back_color: '0xff444444'
    key_text_color: '0xfff5f5f5'
    candidate_text_color: '0xfff5f5f5'
    text_color: '0xfff5f5f5'
    preview_text_color: '0xfff5f5f5'
    hilited_key_text_color: '0xfff5f5f5'
    hilited_candidate_text_color: '0xfff5f5f5'
    key_symbol_color: '0xffcccccc'
    off_key_symbol_color: '0xffcccccc'
    on_key_symbol_color: '0xffffffff'
    comment_text_color: '0xffaaaaaa'
    label_color: '0xffaaaaaa'
    off_key_back_color: '0xff2c2c2c'
    off_key_text_color: '0xfff5f5f5'
    hilited_key_back_color: '0xff3f7fff'
    hilited_candidate_back_color: '0xff3f7fff'
    on_key_back_color: '0xff3f7fff'
    accent: '0xff3f7fff'
    hilited_key_symbol_color: '0xffffffff'
    on_key_text_color: '0xffffffff'
    key_border_color: '0xff1b1b1b'
    border_color: '0xff1b1b1b'
    candidate_separator_color: '0xff1b1b1b'
  light:
    name: New布局浅色
    dark_scheme: default
    light_scheme: light
    back_color: '0xffe8e9ed'
    keyboard_back_color: '0xffe8e9ed'
    root_background: '0xffe8e9ed'
    candidate_background: '0xffe8e9ed'
    text_back_color: '0xffe8e9ed'
    liquid_keyboard_background: '0xffe8e9ed'
    key_back_color: '0xffffffff'
    preview_back_color: '0xffffffff'
    key_text_color: '0xff202124'
    candidate_text_color: '0xff202124'
    text_color: '0xff202124'
    preview_text_color: '0xff202124'
    hilited_key_text_color: '0xffffffff'
    hilited_candidate_text_color: '0xffffffff'
    key_symbol_color: '0xff50545b'
    off_key_symbol_color: '0xff50545b'
    on_key_symbol_color: '0xffffffff'
    comment_text_color: '0xff757980'
    label_color: '0xff757980'
    off_key_back_color: '0xffcdd0d7'
    off_key_text_color: '0xff202124'
    hilited_key_back_color: '0xff3f7fff'
    hilited_candidate_back_color: '0xff3f7fff'
    on_key_back_color: '0xff3f7fff'
    accent: '0xff3f7fff'
    hilited_key_symbol_color: '0xffffffff'
    on_key_text_color: '0xffffffff'
    key_border_color: '0xffe8e9ed'
    border_color: '0xffe8e9ed'
    candidate_separator_color: '0xffe8e9ed'
tool_bar:
  button_spacing: 2
  primary_button:
    size: [34, 40]
    foreground:
      style: "⋯"
      normal: candidate_text_color
      padding: 4
    action: menu_keyboard
  # Secondary buttons are arranged from right to left.
  buttons:
  - size: [34, 40]
    foreground:
      style: ""
      normal: candidate_text_color
    action: Hide
  - size: [34, 40]
    foreground:
      style: "ic@microphone"
      normal: candidate_text_color
    action: VOICE_ASSIST
  - size: [34, 40]
    foreground:
      style: "ic@emoticon"
      normal: candidate_text_color
    action: liquid_keyboard_emoji
  - size: [34, 40]
    foreground:
      style: "ic@clipboard"
      normal: candidate_text_color
    action: clipboard_window
  - size: [34, 40]
    foreground:
      style: "ic@arrow_all"
      normal: candidate_text_color
    action: Keyboard_editor
  - size: [34, 40]
    foreground:
      style: "↷"
      normal: candidate_text_color
    action: redo
  - size: [34, 40]
    foreground:
      style: "↶"
      normal: candidate_text_color
    action: undo
preset_keys:
  __include: tongwenfeng.trime:/preset_keys
  liquid_keyboard_lock: {label: 锁定, send: FUNCTION, command: liquid_keyboard_lock}
  Keyboard_layout:
    label: 布局
    send: Eisu_toggle
    select: .next
  Ifly_symbols:
    label: 符
    send: FUNCTION
    command: liquid_keyboard
    option: 常用
  Ifly_back:
    label: 返回
    send: Eisu_toggle
    select: default
  Ifly_space:
    slide_cursor: true
    label: 空格
    send: space
    functional: false
    repeatable: false
  Ifly_symbol_q:
    label: '1'
    commit: '1'
  Ifly_symbol_w:
    label: '2'
    commit: '2'
  Ifly_symbol_e:
    label: '3'
    commit: '3'
  Ifly_symbol_r:
    label: '4'
    commit: '4'
  Ifly_symbol_t:
    label: '5'
    commit: '5'
  Ifly_symbol_y:
    label: '6'
    commit: '6'
  Ifly_symbol_u:
    label: '7'
    commit: '7'
  Ifly_symbol_i:
    label: '8'
    commit: '8'
  Ifly_symbol_o:
    label: '9'
    commit: '9'
  Ifly_symbol_p:
    label: '0'
    commit: '0'
  Ifly_symbol_a:
    label: '~'
    commit: '~'
  Ifly_symbol_s:
    label: '!'
    commit: '!'
  Ifly_symbol_d:
    label: '@'
    commit: '@'
  Ifly_symbol_f:
    label: /
    commit: /
  Ifly_symbol_g:
    label: '%'
    commit: '%'
  Ifly_symbol_h:
    label: “
    commit: “
  Ifly_symbol_j:
    label: ”
    commit: ”
  Ifly_symbol_k:
    label: '*'
    commit: '*'
  Ifly_symbol_l:
    label: '?'
    commit: '?'
  Ifly_symbol_z:
    label: (
    commit: (
  Ifly_symbol_x:
    label: )
    commit: )
  Ifly_symbol_c:
    label: '-'
    commit: '-'
  Ifly_symbol_v:
    label: _
    commit: _
  Ifly_symbol_b:
    label: ':'
    commit: ':'
  Ifly_symbol_n:
    label: ;
    commit: ;
  Ifly_symbol_m:
    label: 、
    commit: 、
  Ifly_symbol_apostrophe:
    label: "'"
    commit: "'"
preset_keyboards:
  default:
    name: New布局26键
    ascii_mode: 0
    reset_ascii_mode: false
    lock: true
    width: 10
    keys:
    - click: q
      label_symbol: '1'
      long_click: Ifly_symbol_q
      popup: [Ifly_symbol_q, Letter_commit_q, Letter_commit_Q]
    - click: w
      label_symbol: '2'
      long_click: Ifly_symbol_w
      popup: [Ifly_symbol_w, Letter_commit_w, Letter_commit_W]
    - click: e
      label_symbol: '3'
      long_click: Ifly_symbol_e
      popup: [Ifly_symbol_e, Letter_commit_e, Letter_commit_E]
    - click: r
      label_symbol: '4'
      long_click: Ifly_symbol_r
      popup: [Ifly_symbol_r, Letter_commit_r, Letter_commit_R]
    - click: t
      label_symbol: '5'
      long_click: Ifly_symbol_t
      popup: [Ifly_symbol_t, Letter_commit_t, Letter_commit_T]
    - click: y
      label_symbol: '6'
      long_click: Ifly_symbol_y
      popup: [Ifly_symbol_y, Letter_commit_y, Letter_commit_Y]
    - click: u
      label_symbol: '7'
      long_click: Ifly_symbol_u
      popup: [Ifly_symbol_u, Letter_commit_u, Letter_commit_U]
    - click: i
      label_symbol: '8'
      long_click: Ifly_symbol_i
      popup: [Ifly_symbol_i, Letter_commit_i, Letter_commit_I]
    - click: o
      label_symbol: '9'
      long_click: Ifly_symbol_o
      popup: [Ifly_symbol_o, Letter_commit_o, Letter_commit_O]
    - click: p
      label_symbol: '0'
      long_click: Ifly_symbol_p
      popup: [Ifly_symbol_p, Letter_commit_p, Letter_commit_P]
    - width: 5
    - click: a
      label_symbol: '~'
      long_click: Ifly_symbol_a
      popup: [Ifly_symbol_a, Letter_commit_a, Letter_commit_A]
    - click: s
      label_symbol: '!'
      long_click: Ifly_symbol_s
      popup: [Ifly_symbol_s, Letter_commit_s, Letter_commit_S]
    - click: d
      label_symbol: '@'
      long_click: Ifly_symbol_d
      popup: [Ifly_symbol_d, Letter_commit_d, Letter_commit_D]
    - click: f
      label_symbol: /
      long_click: Ifly_symbol_f
      popup: [Ifly_symbol_f, Letter_commit_f, Letter_commit_F]
    - click: g
      label_symbol: '%'
      long_click: Ifly_symbol_g
      popup: [Ifly_symbol_g, Letter_commit_g, Letter_commit_G]
    - click: h
      label_symbol: “
      long_click: Ifly_symbol_h
      popup: [Ifly_symbol_h, Letter_commit_h, Letter_commit_H]
    - click: j
      label_symbol: ”
      long_click: Ifly_symbol_j
      popup: [Ifly_symbol_j, Letter_commit_j, Letter_commit_J]
    - click: k
      label_symbol: '*'
      long_click: Ifly_symbol_k
      popup: [Ifly_symbol_k, Letter_commit_k, Letter_commit_K]
    - click: l
      label_symbol: '?'
      long_click: Ifly_symbol_l
      popup: [Ifly_symbol_l, Letter_commit_l, Letter_commit_L]
    - width: 5
    - click: Shift_L
      composing: Ifly_separator
      label: ic@apple_keyboard_shift
      width: 15
      key_back_color: off_key_back_color
    - click: z
      label_symbol: (
      long_click: Ifly_symbol_z
      popup: [Ifly_symbol_z, Letter_commit_z, Letter_commit_Z]
    - click: x
      label_symbol: )
      long_click: Ifly_symbol_x
      popup: [Ifly_symbol_x, Letter_commit_x, Letter_commit_X]
    - click: c
      label_symbol: '-'
      long_click: Ifly_symbol_c
      popup: [Ifly_symbol_c, Letter_commit_c, Letter_commit_C]
    - click: v
      label_symbol: _
      long_click: Ifly_symbol_v
      popup: [Ifly_symbol_v, Letter_commit_v, Letter_commit_V]
    - click: b
      label_symbol: ':'
      long_click: Ifly_symbol_b
      popup: [Ifly_symbol_b, Letter_commit_b, Letter_commit_B]
    - click: n
      label_symbol: ;
      long_click: Ifly_symbol_n
      popup: [Ifly_symbol_n, Letter_commit_n, Letter_commit_N]
    - click: m
      label_symbol: "、'"
      long_click: Ifly_symbol_m
      popup: [Letter_commit_M, Letter_commit_m, Ifly_symbol_m, Ifly_symbol_apostrophe]
    - click: BackSpace
      swipe_up: Ifly_clear_all
      swipe_down: restore_cleared
      label: ic@backspace_outline
      width: 15
      key_back_color: off_key_back_color
    - click: Keyboard_number
      width: 12.5
      key_back_color: off_key_back_color
    - click: Ifly_symbols
      label_symbol: 简洁
      long_click: "{hide_key_symbol}{hide_key_hint}"
      width: 12.5
      key_back_color: off_key_back_color
    - click: ','
      label: ，
      width: 10
    - click: Ifly_space
      long_click: Mode_switch
      swipe_left: Left
      swipe_right: Right
      width: 35
    - click: .
      label: 。
      width: 10
    - click: Return
      label: ic@keyboard_return
      key_text_color: on_key_text_color
      width: 20
      key_back_color: accent
  number:
    name: New布局数字
    lock: true
    ascii_mode: 1
    keys:
    - click: plus
      width: 15
      key_back_color: off_key_back_color
    - click: '1'
      width: 23
    - click: '2'
      width: 23
    - click: '3'
      width: 23
    - click: BackSpace
      swipe_up: Ifly_clear_all
      swipe_down: restore_cleared
      width: 16
      key_back_color: off_key_back_color
      label: ic@backspace_outline
    - click: minus
      width: 15
      key_back_color: off_key_back_color
    - click: '4'
      width: 23
    - click: '5'
      width: 23
    - click: '6'
      width: 23
    - click: Ifly_space
      long_click: Mode_switch
      swipe_left: Left
      swipe_right: Right
      width: 16
      key_back_color: off_key_back_color
    - click: slash
      width: 15
      key_back_color: off_key_back_color
    - click: '7'
      width: 23
    - click: '8'
      width: 23
    - click: '9'
      width: 23
    - click: Return
      label: ic@keyboard_return
      key_text_color: on_key_text_color
      width: 16
      key_back_color: accent
    - click: Ifly_back
      width: 15
      key_back_color: accent
    - click: comma
      width: 23
    - click: '0'
      width: 23
    - click: period
      width: 23
    - click: at
      width: 16
      key_back_color: off_key_back_color
  editor:
    name: 编辑
    ascii_mode: 1
    width: 25
    keys:
    - click: select_all
    - click: Home
    - click: Up
    - click: End
    - click: cut
    - click: Left
    - click: Down
    - click: Right
    - click: copy
    - click: undo
    - click: redo
    - click: paste
    - click: Ifly_back
      key_back_color: off_key_back_color
    - click: Ifly_space
      long_click: Mode_switch
      swipe_left: Left
      swipe_right: Right
    - click: BackSpace
      key_back_color: off_key_back_color
      swipe_up: Ifly_clear_all
      swipe_down: restore_cleared
    - click: Return
      key_back_color: accent
      label: ic@keyboard_return
      key_text_color: on_key_text_color
liquid_keyboard:
  row: 4
  row_land: 4
  key_height: 48
  single_width: 56
  vertical_gap: 6
  margin_x: 4
  fixed_key_bar:
    position: left
    keys:
    - liquid_keyboard_lock
    - space1
    - BackSpace
    - liquid_keyboard_exit
  keyboards:
  - emoji
  - common
  - cn
  - en
  - web
  - math
  - email
  - special
  emoji:
    __include: tongwenfeng.trime:/liquid_keyboard/emoji
    name: 表情
  common:
    name: 常用
    type: SINGLE
    keys: ，。？！、：；…—～·（）《》“”‘’
  cn:
    name: 中文
    type: SINGLE
    keys: ，。？！、：；“”‘’（）【】《》〈〉「」『』……——
  en:
    name: 英文
    type: SINGLE
    keys:
    - ','
    - .
    - '?'
    - '!'
    - ':'
    - ;
    - ''''
    - '"'
    - (
    - )
    - '['
    - ']'
    - '{'
    - '}'
    - '-'
    - _
    - /
    - '@'
    - '#'
    - '&'
    - '*'
    - +
  web:
    name: 网址
    type: SINGLE
    keys:
    - www.
    - https://
    - http://
    - .com
    - .cn
    - .net
    - .org
    - .com.cn
    - /
    - .
    - ':'
    - '?'
    - '='
    - '&'
    - '%'
    - '#'
    - '-'
    - _
  math:
    name: 数学
    type: SINGLE
    keys: ＋－×÷＝≠≈±%‰<>≤≥∞√π()[]{}
  email:
    name: 邮箱
    type: SINGLE
    keys:
    - '@'
    - .com
    - .cn
    - .net
    - .org
    - '@qq.com'
    - '@163.com'
    - '@126.com'
    - '@gmail.com'
    - '@outlook.com'
    - '@hotmail.com'
    - '@icloud.com'
    - '-'
    - _
    - .
  special:
    name: 特殊
    type: SINGLE
    keys: ☆★○●□■◇◆♡♥→←↑↓℃￥$€£©®™§
