# Rime schema
# encoding: utf-8


# 方案说明
schema:
  schema_id: rime_frost
  name: 白霜拼音
  version: "2026-10-30"
  author:
    - Dvel
    - gaboolic
  description: |
    白霜拼音
    https://github.com/gaboolic/rime-frost
  dependencies:
    - chen_eng        # dedicated English completion (hidden from schema_list)
    - melt_eng        # 英文输入，作为次翻译器挂载到拼音方案
    - radical_pinyin  # 部件拆字，反查及辅码
    - rime_frost_aux  # single-char aux lookup


# 开关
# reset: 默认状态。注释掉后，切换窗口时不会重置到默认状态。
# states: 方案选单显示的名称。可以注释掉，仍可以通过快捷键切换。
# abbrev: 默认的缩写取 states 的第一个字符，abbrev 可自定义一个字符
switches:
  - name: ascii_mode
    states: [ 中文, 英文 ]
  - name: traditionalization
    states: [ 简体, 繁体 ]
  - name: ascii_punct  # 中英标点
    reset: 0
    states: [ 。，, ．， ]

  - name: emoji
    states: [ 💀, 😄 ]

  - name: chinese_english
    states: [ 翻译关, 翻译开 ]

  - name: mars
    reset: 0
    states: [ 地, 煋 ] #火星文

  - name: pin_cand
    states: [ 固顶关, 固顶开 ]

# 输入引擎
engine:
  processors:
    - lua_processor@*select_character          # 以词定字
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - affix_segmentor@radical_lookup  # 部件拆字自定义 tag
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator@frost_aux       # ` single-char aux lookup
    - script_translator
    - lua_translator@*date_translator    # 时间、日期、星期
    - lua_translator@*lunar              # 农历节气
    - lua_translator@*unicode            # Unicode 输入
    - lua_translator@*number_translator  # 数字金额大写
    - lua_translator@*calculator         # 计算器
    - table_translator@custom_phrase    # 自定义短语
    - table_translator@chen_eng        # English vocabulary through the separate chen_eng schema
    - reverse_lookup_translator@radical_pinyin  # 部件拆字，反查及辅码
    - reverse_lookup_translator@frost_aux  # 拼音、笔画等反查，作为输入码直接挂载
  filters:
    - lua_filter@*corrector                       # 容错、纠错
    - simplifier@radical_lookup                  # reverse_lookup_filter 必须放在最后，这里用 simplifier 替代
    - lua_filter@*aux_lookup_filter                  # ` phrase aux lookup
    - lua_filter@*chen_custom_phrase_pos             # 自定义短语候选位置
    - simplifier@emoji                              # Emoji
    - simplifier@chinese_english
    - simplifier@traditionalize                     # 简繁切换
    - simplifier@mars                               #火星文
    - lua_filter@*pin_cand_filter                   # 置顶候选项
    - lua_filter@*reduce_english_filter             # 降低部分英语单词在候选项的位置
    - lua_filter@*autocap_filter                    # 英文自动大写
    - lua_filter@*long_word_filter                  # 长词优先
    - lua_filter@*cn_en_fuse_filter                 # 中英混输合并
    - uniquifier                                    # 去重

# 拼音
speller:
  # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
  alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
  initials: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"  # 第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
  algebra:
    - erase/^.*$/

# 翻译器
translator:
  dictionary: rime_frost            # 挂载词库 rime_frost.dict.yaml
  spelling_hints: 5                 # 常用字应显示实际输入码，而不是辅助码
  always_show_comments: true        # 始终显示辅助码注释，无论是否完整输入。
  initial_quality: 1.2              # 词频权重
  preedit_format:                   # 上屏码自定义
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - "xlit|bpmfdtnlgkhjqxZCSrzcsywVueaoeiuv|bpmfdtnlgkhjqxZCSrzcsywVüeaoeiuv|"
  comment_format:                   # 注释码自定义
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - "xlit|bpmfdtnlgkhjqxZCSrzcsywVueaoeiuv|bpmfdtnlgkhjqxZCSrzcsywVüeaoeiuv|"
  # enable_correction: true           # 纠错，默認关闭，需要手动开启，移植时可能需要注释。

# 部件拆字，反查及辅码
radical_lookup:
  dictionary: melt_eng  # 随意挂载一个词库作为占位。
  prefix: "u"
  tips: 〔部件拆字〕
  preedit_format:
    - "xlit|bpmfdtnlgkhjqxzcsrywv|㇐㇑㇓㇔㇕一丨丿丶乙丶丨丿丶日目八人艹丨丿丶木日十口囗夂|"
  comment_format:
    - xform/^/〔/
    - xform/$/〕/

# ` phrase aux lookup
frost_aux:
  dictionary: frost_aux
  db_class: stabledb
  enable_charset_filter: false
  enable_sentence: false
  enable_user_dict: false
  initial_quality: 1
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - "xlit|bpmfdtnlgkhjqxZCSrzcsywVueaoeiuv|bpmfdtnlgkhjqxZCSrzcsywVüeaoeiuv|"
  comment_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - "xlit|bpmfdtnlgkhjqxZCSrzcsywVueaoeiuv|bpmfdtnlgkhjqxZCSrzcsywVüeaoeiuv|"

# 英文输入，作为次翻译器挂载到拼音方案
melt_eng:
  dictionary: melt_eng       # 挂载词库 melt_eng.dict.yaml
  spelling_hints: 0        # 候选序列后默认不显示自定义输入码，按 ctrl 或用户自定义按键显示；设置为 0 始终隐藏。
  enable_sentence: false     # 禁止造句
  enable_user_dict: false    # 禁用用户词典
  initial_quality: 1.1       # 初始权重
  comment_format:            # 自定义提示码
    - xform/.*//             # 清空提示码
  max_homophones: 4          # 取消多音字排列
  max_homographs: 4          # 取消多音字排列

# English vocabulary completion uses the separate chen_eng schema. Chen's
# built-in correctors read the already-normalized spelling directly, so the
# shared rime_frost pinyin-to-alphabet patch is intentionally not reused here.
chen_eng:
  dictionary: chen_eng
  enable_sentence: false
  enable_user_dict: false
  enable_completion: true
  enable_charset_filter: false
  initial_quality: 1.25
  comment_format:
    - xform/.*//

# 部件拆字，反查及辅码
radical_pinyin:
  dictionary: radical_pinyin
  enable_completion: true
  comment_format:
    - "xlit|bpmfdtnlgkhjqxzcsrywv|㇐㇑㇓㇔㇕一丨丿丶乙丶丨丿丶日目八人艹丨丿丶木日十口囗夂|"
  spelling_hints: 0
  prefix: "u"
  suffix: "'"
  preedit_format:
    - "xlit|bpmfdtnlgkhjqxzcsrywv|㇐㇑㇓㇔㇕一丨丿丶乙丶丨丿丶日目八人艹丨丿丶木日十口囗夂|"

# 自定义短语
# 此配置用于开启 custom_phrase 功能，需要用户手动将 custom_phrase.txt 内容复制到自己的用户目录中
custom_phrase:
  dictionary: ""
  user_dict: custom_phrase
  db_class: stabledb
  enable_completion: false # 补全提示
  enable_sentence: false    # 禁止造句
  initial_quality: 99       # custom_phrase 的权重应该比 pinyin 和 melt_eng 大

#中文转英文
chinese_english:
  option_name: chinese_english
  opencc_config: chinese_english.json
  tips: all
  show_in_comment: false

#简繁切换
traditionalize:
  option_name: traditionalization
  opencc_config: t2s.json
  tips: all

#火星文
mars:
  option_name: mars
  opencc_config: mars.json
  tips: all

# Emoji
emoji:
  opencc_config: emoji.json
  option_name: emoji
  tips: all

# 标点符号
punctuator:
  full_shape:
    __include: default:/punctuator/full_shape
  half_shape:
    __include: default:/punctuator/half_shape

# 处理符合特定规则的输入码，如网址、反查等
recognizer:
  import_preset: default  # 从 default.yaml 继承通用的
  patterns: # 再增加方案专有的：
    punct: "^/([0-9]0?|[A-Za-z]+)$"
    unicode: "^U[0-9a-fA-F]+$"
    number: "^R[0-9]+[.]?[0-9]*$"
    calculator: '^=[0-9+\-*/().^%]*$'
    reverse_lookup: "`[a-z]*'?$"

# 从 default.yaml 继承通用的快捷键
key_binder:
  import_preset: default

# 具体实现可以参考 https://github.com/hchunhui/librime-lua/wiki/Scripting
lua_translator@lunar:
  trigger: "N"
lua_translator@unicode:
  trigger: "U"
lua_translator@number_translator:
  trigger: "R"
lua_translator@calculator:
  trigger: "="
